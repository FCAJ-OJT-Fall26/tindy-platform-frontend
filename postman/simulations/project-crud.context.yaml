purpose:
  stands_in_for: Local Tindy backend Project, Position, Skill, Catalog, session-read, Teammates, Invitation and owner-consent contracts
  unblocks: Frontend HTTP contract checks without production or PostgreSQL access; real PostgreSQL smoke uses a separate Testcontainers host
assumptions:
  - id: release-verification-2026-11-05
    status: supported
    claim: The exercised V1 frontend contracts also work with the real sibling ASP.NET Core backend and disposable PostgreSQL, independently of this simulation.
    reason: A new browser suite used separate real JWT accounts, production controllers/repositories/EF mappings and the existing guarded test database factory; mock response assertions were not treated as backend evidence.
    verification: On 2026-11-05, test:release:integration passed 19 groups, 92 direct API checks and 245 browser HTTP requests covering opt-in, discovery, Invitation/Notification lifecycle, read state, membership, capacity races and session isolation. The fresh database applied 21 migrations with no pending model changes. The separately rerun backend assembly had 1006 passed, 1 unrelated CORS policy/test contract failure and 2 opt-in ClamAV skips. Release remains Needs Fixes until that CORS disagreement is resolved. Repeated-outage controls were added to this local mock to prevent StrictMode cancellations from consuming one-shot Candidate error fixtures; production behavior is unchanged.
    source: tests/release-integration.browser.mjs; tests/live-teammates-host/Program.cs; .tmp-release-verification/evidence.json; sibling tests/Tindy.Tests/TestResults/release-verification.trx; FIND_TEAMMATES_RELEASE_VERIFICATION.md
    updated_at: "2026-11-05"
  - id: notifications-v1-and-candidate-polish
    status: supported
    claim: The real frontend uses the implemented Notifications V1 API, shares server-owned read state and unread counts, polls only visible authenticated sessions, and filters active members by position_id in the exercised scenarios.
    reason: The stand-in was extended from the sibling backend Notification DTOs, controller, repository and documented migration; browser tests call the real apiRequest wrapper over HTTP without replacing fetch.
    verification: On 2026-11-05, test:notifications passed 11 groups including pagination, read and mark-all deduplication, delayed responses, late notification cutoff, malformed JSON, visibility, account switch/logout and all four navigation events. test:candidates:polish passed 7 groups for GUID-based Active filtering, nullable Leader positions, archived URL fallback, loading/error/empty states, Settings and dirty-only opt-in PATCH. Required Teammates suites passed 16, 15 and 6 groups; Profile regression passed 44 groups. Polling timer callbacks and document visibility were controlled in the browser. This proves frontend behavior against the HTTP stand-in, not a live deployment or database transactions.
    source: tests/notifications.browser.mjs; tests/candidates-polish.browser.mjs; src/services/notifications.service.ts; src/hooks/useNotificationState.ts; sibling tindy-backend-platform/docs/api/NOTIFICATIONS_V1.md; NOTIFICATIONS_PIPELINE_FRONTEND_IMPLEMENTATION.md
    updated_at: "2026-11-05"
  - id: teammates-v1-frontend-contract
    status: supported
    claim: Teammate routes use Backend callers without a feature flag or runtime mock branch, preserve UUID and Position context, consume server matching, confirm interactions and Invitations, and reconcile uncertain writes through authorized history.
    reason: The stand-in follows the implemented sibling Backend controllers and DTOs; synthetic fixture scores are response inputs, not a production scorer.
    verification: On 2026-11-03, test:teammates passed 16 browser/service groups, test:teammates:errors passed 15 failure/privacy/history groups, test:teammates:regression passed 6 Project/Apply/Approval/dashboard/always-Backend groups, and test:discovery-actions passed 9 routing/action groups. The separate real Backend/PostgreSQL smoke passed 6 groups; that result does not derive from this simulation. Known baseline failures are recorded in the implementation report.
    source: tests/teammates.browser.mjs; tests/teammates-errors.browser.mjs; tests/teammates-project-regression.browser.mjs; tests/teammates.live.browser.mjs; postman/mocks/tindy-project/handler.js; DISCOVERY_TEAMMATES_FRONTEND_IMPLEMENTATION.md
    updated_at: "2026-11-03"
  - id: discovery-applications-v1
    status: supported
    claim: The frontend sends the implemented V1 deadline, discovery, saved/skipped and application contract and waits for confirmed mutations.
    reason: Sibling backend DTOs and docs were inspected; Chrome exercised the real React app through local HTTP Postman simulation.
    verification: On 2026-10-30, Project checks passed 27 scenarios and Recruitment checks passed 19 scenarios, including 70-item feed, GUID filters, physical swipes, confirm-only Apply, immediate same-position reapply, caller isolation, leader review conflicts and lost-response reconciliation. This establishes frontend behavior against a synthetic contract, not PostgreSQL locking or the backend scorer.
    source: tests/projects.browser.mjs; tests/recruitment.browser.mjs; postman/mocks/tindy-project/handler.js; DISCOVERY_FRONTEND_INTEGRATION.md; sibling docs/api/DISCOVERY_API.md
    updated_at: "2026-10-30"
  - id: caller-contract
    status: supported
    claim: The revised frontend uses the existing snake_case Project and Position contracts, catalog UUIDs and response envelopes in the scenarios exercised.
    reason: Backend DTOs/controllers/services were inspected and the real frontend made matching HTTP requests through the stand-in.
    verification: On 2026-10-29, npm run test:projects passed 22 checks, including UUID preservation, optional description, ownership and actual member-count rendering. This verifies the frontend against the modeled contract, not a live database.
    source: src/types/project.ts; src/services/projects.service.ts; tests/projects.browser.mjs; sibling tindy-backend-platform ProjectDtos.cs, ProjectsController.cs and ProjectPositionsController.cs
    updated_at: "2026-10-29"
  - id: partial-edit-retry
    status: supported
    claim: In the tested partial edit, a confirmed newly created Position is reused on retry after its skill write fails.
    reason: The caller retained the server Position UUID and compared the pending draft with refetched state.
    verification: On 2026-10-29, the simulated Position POST succeeded, skill POST returned 500, the form retained pending input, and retry completed with exactly one Position creation request. Removal of a Position created earlier in the same edit was also exercised.
    source: src/services/projectEditor.service.ts; tests/projects.browser.mjs; postman/mocks/tindy-project/handler.js
    updated_at: "2026-10-29"
  - id: archive-confirmation
    status: supported
    claim: A failed archive retains the active card, while a confirmed archive removes it and refreshes membership in the exercised frontend flow.
    reason: The dashboard waits for DELETE confirmation before changing its active collection.
    verification: On 2026-10-29, an injected DELETE 500 preserved the Project card and displayed an error; the subsequent successful archive closed modeled Positions and removed the active card.
    source: src/pages/leader/LeaderDashboardScreen.tsx; tests/projects.browser.mjs; postman/mocks/tindy-project/handler.js
    updated_at: "2026-10-29"
  - id: production-unknown-write-outcomes
    status: unknown
    claim: Unknown POST outcomes can always be reconciled uniquely against the live backend.
    reason: The existing API has no idempotency-key contract. The client blocks additional POSTs when no unique result is available; concurrent identical creates and late commits cannot be universally identified by content.
    verification: A local committed create followed by a lost response was recovered with one POST, and an uncommitted interrupted request remained blocked from blind reposting. No live PostgreSQL or production concurrency check was run.
    source: src/services/projectEditor.service.ts; tests/projects.browser.mjs; PROJECT_CRUD_INTEGRATION.md
    updated_at: "2026-10-29"
  - id: three-step-create
    status: supported
    claim: The creation wizard retains draft data between steps and refresh, validates before progressing, and performs no Project writes until final Publish.
    reason: The real frontend navigated through all steps against the local HTTP stand-in before any Project POST was recorded.
    verification: On 2026-10-29, npm run test:projects passed 26 checks including new step navigation, inline validation, skill selection, Back/refresh retention and preview cases. Desktop/mobile screenshots were inspected; edit and save/retry regression paths also passed.
    source: src/components/projects/ProjectForm.tsx; src/index.css; tests/projects.browser.mjs
    updated_at: "2026-10-29"
