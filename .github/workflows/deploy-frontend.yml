name: Deploy frontend

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify AWS federation or publish the frontend.
        type: choice
        options: [verify-oidc, deploy]
        default: verify-oidc
        required: true
      release_sha:
        description: Full commit SHA from main. Leave blank to use this run's main commit.
        type: string
        required: false

permissions: {}

concurrency:
  group: tindy-frontend-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select release commit
        env:
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             ! git merge-base --is-ancestor "$RELEASE_SHA" "$GITHUB_SHA"; then
            echo "::error::Select a full commit SHA from the history of this run's main commit."
            exit 1
          fi
          git checkout --detach "$RELEASE_SHA"
          printf 'Frontend release: `%s`\n' "$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build for CloudFront same-origin routing
        env:
          VITE_API_BASE_URL: ''
        run: npm run build

      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
          (inputs.mode == 'verify-oidc' || needs.build.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
    env:
      FRONTEND_BUCKET: ${{ vars.TINDY_FRONTEND_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.TINDY_FRONTEND_DISTRIBUTION_ID }}
      PUBLIC_HOST: ${{ vars.TINDY_FRONTEND_HOST }}
      ROLE_ARN: ${{ vars.TINDY_FRONTEND_DEPLOY_ROLE_ARN }}
    steps:
      - name: Check repository configuration
        env:
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          if [[ ! "$ROLE_ARN" =~ ^arn:aws:iam::572454213668:role/tindy-foundation-FrontendDeployRole-[[:alnum:]]+$ ]]; then
            echo "::error::Set TINDY_FRONTEND_DEPLOY_ROLE_ARN from the tindy-foundation stack output."
            exit 1
          fi
          if [[ "$RELEASE_MODE" == deploy ]] &&
             [[ ! "$FRONTEND_BUCKET" =~ ^tindy-foundation-frontendbucket-[a-z0-9]+$ ||
                ! "$DISTRIBUTION_ID" =~ ^[A-Z0-9]+$ ||
                ! "$PUBLIC_HOST" =~ ^[a-z0-9]+\.cloudfront\.net$ ]]; then
            echo "::error::Set the frontend bucket, distribution ID and CloudFront hostname from the stack outputs."
            exit 1
          fi

      - name: Download release artifact
        if: inputs.mode == 'deploy'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: frontend-dist
          path: dist/

      - name: Assume AWS role through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: ${{ env.ROLE_ARN }}
          allowed-account-ids: '572454213668'
          role-duration-seconds: 900
          role-session-name: tindy-frontend-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity --query Arn --output text

      - name: Publish assets, then HTML
        if: inputs.mode == 'deploy'
        run: |
          test -s dist/index.html
          test -d dist/assets
          aws s3 sync dist/assets/ "s3://$FRONTEND_BUCKET/assets/" \
            --cache-control 'public,max-age=31536000,immutable' --no-follow-symlinks --only-show-errors
          aws s3 sync dist/ "s3://$FRONTEND_BUCKET/" --exclude 'index.html' --exclude 'assets/*' \
            --cache-control 'no-cache,max-age=0,must-revalidate' --no-follow-symlinks --only-show-errors
          aws s3 cp dist/index.html "s3://$FRONTEND_BUCKET/index.html" \
            --content-type 'text/html; charset=utf-8' \
            --cache-control 'no-cache,max-age=0,must-revalidate' --only-show-errors

      - name: Invalidate CloudFront cache
        if: inputs.mode == 'deploy'
        run: |
          invalidation_id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths '/' '/index.html' '/favicon.svg' '/logo.png' '/robots.txt' \
            --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$invalidation_id"

      - name: Verify SPA and JavaScript through CloudFront
        if: inputs.mode == 'deploy'
        run: |
          for route in / /login; do
            curl --fail --silent --show-error --max-time 30 "https://$PUBLIC_HOST$route" --output served-index.html
            cmp dist/index.html served-index.html
          done
          script_path=$(grep -oE 'src="/assets/[^"]+\.js"' dist/index.html | head -n 1)
          script_path=${script_path#src=\"}
          script_path=${script_path%\"}
          test -n "$script_path"
          curl --fail --silent --show-error --max-time 30 "https://$PUBLIC_HOST$script_path" --output served-script.js
          cmp "dist$script_path" served-script.js
